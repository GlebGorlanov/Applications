name: Build Calculator (All Platforms)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Calculator Electron/**'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        working-directory: ./Calculator Electron
        run: npm install

      - name: 🏗️ Build Vite project
        working-directory: ./Calculator Electron
        run: npm run build

      - name: 🧮 Build Electron for Windows
        working-directory: ./Calculator Electron
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Windows
          path: Calculator Electron/dist/*.exe
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcb-dri3-0 \
            fuse \
            libfuse2 \
            fakeroot \
            dpkg

      - name: 📦 Install dependencies
        working-directory: ./Calculator Electron
        run: |
          npm install
          chmod +x node_modules/.bin/*

      - name: 🏗️ Build Vite project
        working-directory: ./Calculator Electron
        run: npm run build

      - name: 🧮 Build Electron for Linux
        working-directory: ./Calculator Electron
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Check build output
        working-directory: ./Calculator Electron
        run: |
          echo "=== Listing dist directory ==="
          ls -lah dist/ || true
          echo "=== Searching for AppImage files ==="
          find dist -name "*.AppImage" -type f || echo "No AppImage found"

      - name: 💾 Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Linux-AppImage
          path: |
            Calculator Electron/dist/*.AppImage
            Calculator Electron/dist/**/*.AppImage
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        working-directory: ./Calculator Electron
        run: npm install

      - name: 🏗️ Build Vite project
        working-directory: ./Calculator Electron
        run: npm run build

      - name: 🧮 Build Electron for macOS
        working-directory: ./Calculator Electron
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-macOS
          path: Calculator Electron/dist/*.dmg
          if-no-files-found: warn

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "Автоматическая сборка из коммита ${{ github.sha }}"
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          